name: Deploy Node.js app to Azure Web App
 
on:
  push:
    branches:
      - main   # deploy only when pushed to main branch
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
 
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
 
      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
 
      # Install dependencies & build
      - name: Install dependencies
        run: npm install
 
      - name: Build project
        run: npm run build
 
      # Archive build artifacts (optional)
      - name: Archive production files
        run: zip -r release.zip .
 
      # -------------------------
      # 🔵 Deploy to Azure
      # -------------------------
      - name: Azure WebApp Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: SampleCode123        # Example: mynodeapp123
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: release.zip